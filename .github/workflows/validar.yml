name: Validar referência de cooperação
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  referencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dados, exemplos e referências da documentação
        run: node prototipo/tests/run-tests.cjs
